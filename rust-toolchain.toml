[toolchain]
# The latest stable Rust for rustup and CI; Nix builds the stable of its
# locked rust-overlay. Cargo.toml's rust-version is the oldest supported.
channel = "stable"
# llvm-tools: the llvm-cov and llvm-profdata `just coverage` reads profiles with.
components = [ "rustfmt", "clippy", "llvm-tools" ]
targets = [
    "wasm32-unknown-unknown",
    # The static health probe the daemon embeds.
    "x86_64-unknown-linux-musl",
]
