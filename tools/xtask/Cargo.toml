[package]
name = "xtask"
description = "Development tasks for the piqueld workspace, run with `cargo xtask`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
bollard.workspace = true
clap.workspace = true
futures-util.workspace = true
piqueld-client.workspace = true
# Line numbers for `cargo xtask test-waits`'s findings.
proc-macro2 = { workspace = true, features = ["span-locations"] }
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["visit"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }
toml.workspace = true

[lints]
workspace = true
