# Release builds of piqueld, checked after merging instead of before: `nix`,
# `package` (publish --dry-run) and `install` (dist, then install.sh). What
# they cover, when they run and the cache notes are in docs/dev/validation.md.

name: Release checks

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - "**/build/**"
      - "**/migrations/**"
      - rust-toolchain.toml
      - .cargo/**
      - flake.nix
      - flake.lock
      - nix/**
      - apps/piqueld-ui/**
      - apps/piqueld/piqueld.service
      - apps/site/install.sh
      - tools/xtask/**
      - examples/**
      - LICENSE
      - README.md
      - .github/workflows/release-checks.yml
      - .github/actions/report/**
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# Only a branch's latest commit matters; other branches leave main's alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# As in CI and the release workflow: they share rust-cache keys only while
# these CARGO*, RUST* and CC* variables match.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  # Every Nix package; crane's dependency builds are rooted so the cache's GC
  # keeps them.
  nix:
    name: nix packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Purges superseded Nix caches.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Keys are immutable: each main build saves a fresh one.
          primary-key: nix-x86_64-linux-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-x86_64-linux-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}-
            nix-x86_64-linux-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 4G
          # Only caches unused for a day: keeps the last usable one.
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-x86_64-linux-
          purge-last-accessed: P1D
          purge-primary-key: never
      - name: Build Nix packages
        run: nix build -L .#default .#default.cargoArtifacts .#dashboard .#dashboard.cargoArtifacts .#cli .#cli.cargoArtifacts .#daemon
      # Boot VMs with the NixOS modules, through the runner's KVM.
      - name: Test the piqueld and piquelctl modules
        run: nix build -L .#checks.x86_64-linux.piqueld
      - name: Test the build machine and build registry modules
        run: nix build -L .#checks.x86_64-linux.piqueld-builder

  # Everything `just publish` does except uploading.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: |
            target-ui
            target-probe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask publish --dry-run

  # Builds the release archive, then installs it with install.sh as a user
  # would; the second run is an update. Shares the release workflow's cache.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dist
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask dist
      - name: Install with install.sh, then update
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          for run in install update; do
            echo "::group::$run"
            PIQUELD_VERSION="$version" PIQUELD_RELEASE_URL="file://$PWD/target/dist" sh apps/site/install.sh --yes
            echo "::endgroup::"
          done
      - run: sudo piquelctl status
      # sg runs it with the piqueld group the script added.
      - run: sg piqueld -c 'piquelctl setup-link'
      - name: Show the daemon's logs
        if: failure()
        run: sudo journalctl --unit piqueld --no-pager

  # Keeps an issue open while main fails a release check.
  report:
    name: report
    needs: [nix, package, install]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/report
        with:
          title: Release checks fail on main
          # A job that hits its timeout reports `cancelled`.
          failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
