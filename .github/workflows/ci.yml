# Continuous integration: jobs group the `just` recipes by what they compile.
# The job table, the draft, merge queue and cache policy and the `ci` status to
# require are in docs/dev/validation.md; release builds run in release-checks.yml.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Nightly: refreshes main's caches and runs macOS.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat CI caches.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci

jobs:
  # Picks the jobs a pull request needs: filters in .github/filters.yml.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      deny: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deny == 'true' }}
      scripts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.scripts == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ui == 'true' }}
      cli: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || (steps.filter.outputs.cli == 'true' && !github.event.pull_request.draft) }}
      docker: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.docker == 'true' && !github.event.pull_request.draft) }}
      playwright: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.playwright == 'true' && !github.event.pull_request.draft) }}
    steps:
      # The filters file only; the changed paths come from the GitHub API.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/filters.yml
          sparse-checkout-cone-mode: false
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml

  checks:
    name: checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.deny == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-deny,cargo-machete,shellcheck
      # Not in install-action: checked against the pinned SHA-256.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --remote-name "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$archive"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: just fmt-check
      - run: just lint-ci
      - run: just audit
      - run: just unused

  # Reads more than the Rust sources, so it runs on every change.
  standard:
    name: standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: standard
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just standard

  # Two parallel halves with a cache each: `lint` and `test`. Both embed the
  # prebuilt dashboard.
  rust:
    name: rust (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: |
              just lint
              just doc
              just openapi-check
              just boundary
          - name: test
            run: |
              just test
              just doc-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}
          cache-directories: target-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/dashboard
      - run: ${{ matrix.run }}
      - name: Preserve test report
        if: failure() && matrix.name == 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-workspace
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # The published crates on the oldest Rust `rust-version` promises; warnings
  # aren't errors here.
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for every later step.
      - name: Install the minimum supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --target x86_64-unknown-linux-musl
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: target-probe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --package piqueld --package piquelctl --package piqueld-client

  wasm-ui:
    name: wasm-ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: ${{ runner.temp }}/piqueld-tools
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/install-wasm-tools.sh
      - run: just ui-check
      - run: just check-wasm
      # Ubuntu runners ship a matching Chrome and ChromeDriver pair.
      - name: Run browser transport tests
        run: CHROMEDRIVER="${CHROMEWEBDRIVER:?}/chromedriver" just test-wasm

  # Three shards, each against an engine of its own.
  docker-integration:
    name: docker-integration (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ingress
            suite: ingress
            binary: --lib
          - name: engine 1/2
            suite: engine
            binary: --test docker_integration
            partition: --partition count:1/2
          - name: engine 2/2
            suite: engine
            binary: --test docker_integration
            partition: --partition count:2/2
    env:
      # Within the job's timeout, so cleanup and the test report still run.
      PIQUELD_DOCKER_TEST_TIMEOUT: 20m
      NEXTEST_PROFILE: docker-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.suite }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Prebuilds what `just docker-test` runs, before its Docker-in-Docker starts.
      - name: Compile Docker integration tests
        run: |
          cargo build --locked --package xtask
          cargo nextest run --locked -p piqueld ${{ matrix.binary }} --no-run
      - name: Run Docker integration tests
        run: just docker-test ${{ matrix.suite }} ${{ matrix.partition }}
      - name: Preserve test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-docker-integration-${{ strategy.job-index }}
          path: target/nextest/docker-ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  browser-playwright:
    name: browser-playwright
    needs: changes
    if: needs.changes.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: target-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/dashboard
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned pnpm locally
        run: |
          npm install --prefix "$RUNNER_TEMP/piqueld-playwright-tools" pnpm@12.3.4
          echo "$RUNNER_TEMP/piqueld-playwright-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: just setup-playwright
      - run: pnpm --dir tests/playwright audit --audit-level=moderate
      - run: just test-playwright
      - name: Check documentation screenshots
        run: just docs-screenshots --update-snapshots=none
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-playwright-report
          path: |
            tests/playwright/playwright-report/
            tests/playwright/test-results/
          retention-days: 7
          if-no-files-found: warn

  macos-cli:
    name: cli (macOS)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just validate-cli

  # The flake's `docs` shell provides the tools at flake.lock's versions.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix develop .#docs --command just docs

  # Merge queue: cancels the run at the first failed job. The only job with
  # `actions: write`, so it checks out nothing.
  fail-fast:
    name: fail-fast
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
    steps:
      - name: Cancel the run when a job fails
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
        # Ends when `ci` appears, so a run already reporting isn't cancelled;
        # polls every 30 seconds to stay under the token's rate limit.
        run: |
          while sleep 30; do
            jobs=$(gh api "$JOBS" --jq '.jobs[] | "\(.name)\t\(.conclusion)"') || continue
            if grep -qP '^ci\t' <<<"$jobs"; then
              exit
            fi
            if grep -qP '\t(failure|cancelled|timed_out)$' <<<"$jobs"; then
              gh run cancel "$RUN" && exit
            fi
          done

  ci:
    name: ci
    if: always()
    needs:
      - changes
      - checks
      - standard
      - rust
      - msrv
      - wasm-ui
      - docker-integration
      - browser-playwright
      - macos-cli
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, rust, msrv, wasm-ui, docker-integration, browser-playwright, macos-cli
          jobs: ${{ toJSON(needs) }}

  # The nightly run's failures keep an issue open.
  report:
    name: report
    needs: ci
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/report
        with:
          title: Nightly CI fails on main
          failed: ${{ needs.ci.result != 'success' }}
