# Creates the GitHub release of a version when `just release` pushes its tag,
# such as v0.1.0, with the static release archive install.sh installs, its
# checksums and their build provenance attestations, published once its files
# are uploaded. Its notes list the pull requests merged since the previous
# release. It then makes the version the stable channel's newest build
# (.github/actions/channel). See docs/dev/releasing.md.

name: Release

on:
  push:
    # Not nightlies, such as v0.3.0-nightly.20261125, which the release checks
    # publish. Their tags come from GITHUB_TOKEN, which starts no workflow, so
    # this only guards against a nightly tag pushed by hand.
    tags: ["v*", "!v*-nightly.*"]

permissions:
  contents: read

# As in the release checks: rust-cache's key hashes the CARGO*, RUST* and CC*
# variables, so the build restores the cache of their install job only while
# they match.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Creates the release, and moves the stable tag.
      contents: write
      # Signs and stores the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that the tag is the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::the tag $GITHUB_REF_NAME isn't the workspace version, $version"
            exit 1
          }
      - run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends musl-tools
      # The release checks' install job on main saves this cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dist
          save-if: false
      - run: cargo xtask dist
        env:
          PIQUELD_BUILD_CHANNEL: stable
      # Records that this workflow built the archive and its checksums from
      # the tagged commit, for `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/dist/*
      # The notes start from the previous stable release, not a nightly.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // empty')
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "piqueld ${GITHUB_REF_NAME#v}" --generate-notes ${previous:+--notes-start-tag "$previous"} \
            target/dist/*.tar.gz target/dist/SHA256SUMS
      - uses: ./.github/actions/channel
        with:
          channel: stable
          token: ${{ github.token }}
