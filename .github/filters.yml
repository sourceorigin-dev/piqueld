# Path filters for CI's `changes` job (.github/workflows/ci.yml), which
# dorny/paths-filter matches with picomatch globs, dotfiles included. Each
# filter lists a job's inputs, following the workspace dependency graph:
# piqueld-core <- piqueld-client <- piquelctl, piqueld-ui, xtask, and the
# daemon embeds piqueld-ui. Workspace-wide inputs run everything. The `ci.yml`
# jobs read the filters through the `changes` job's outputs.
workspace: &workspace
  - .github/workflows/**
  - .github/actions/**
  - .github/filters.yml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - .cargo/**
  - .config/**
  - justfile
# The crates the CLI and dashboard build too. The daemon's own
# crates are in `daemon`.
crates: &crates
  - *workspace
  - crates/piqueld-client/**
  - crates/piqueld-core/**
  - crates/piqueld-generated/**
  - crates/piqueld-probe/**
# Every crate, so a new one under crates/ is covered too.
daemon: &daemon
  - *crates
  - apps/piqueld/**
  - crates/**
rust:
  - *daemon
  - apps/**
  - tools/**
  - examples/**
  # A piqueld-core test loads piqueld.dev's manifest and its files.
  - deploy/**
  - .sqlx/**
  - rustfmt.toml
  # Generated by openapi-check.
  - docs/**/*.json
  - docs/user/reference/cli-commands.md
  - docs/user/reference/configuration-settings.md
  - docs/user/reference/manifest-settings.md
deny:
  - *workspace
  - deny.toml
  - '**/Cargo.toml'
ui:
  - *crates
  - apps/piqueld-ui/**
  - scripts/install-wasm-tools.sh
cli:
  - *crates
  - apps/piquelctl/**
docker:
  - *daemon
  - tools/**
  - examples/**
  - scripts/**
playwright:
  - *daemon
  - apps/**
  - tools/**
  - examples/**
  - tests/playwright/**
  # The screenshot specs follow the guides.
  - docs/user/**
  - docs/images/**
