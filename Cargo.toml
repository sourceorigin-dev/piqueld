[workspace]
resolver = "3"
members = [
  "apps/piqueld",
  "apps/piquelctl",
  "apps/piqueld-ui",
  "crates/piqueld-build",
  "crates/piqueld-client",
  "crates/piqueld-config",
  "crates/piqueld-core",
  "crates/piqueld-docker",
  "crates/piqueld-generated",
  "crates/piqueld-probe",
  "crates/piqueld-store",
  "tools/xtask",
]

# Every crate shares one version, released together; see
# docs/dev/releasing.md.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The oldest Rust the crates build with, checked by the `msrv` CI job. Raise it
# when code needs a newer Rust.
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/sourceorigin-dev/piqueld"
homepage = "https://piqueld.dev"
# Unset in the library crates, so crates.io links their docs.rs documentation.
documentation = "https://docs.piqueld.dev"
readme = "README.md"
keywords = ["docker", "swarm", "deployment", "paas", "self-hosted"]

[workspace.dependencies]
chacha20poly1305 = "0.10.1"
zeroize = "1.8"
# Internal; see docs/dev/rust-conventions.md#dependency-pins.
piqueld-build     = { version = "0.1.0", path = "crates/piqueld-build"  }
piqueld-client    = { version = "0.1.0", path = "crates/piqueld-client" }
piqueld-config    = { version = "0.1.0", path = "crates/piqueld-config" }
piqueld-core      = { version = "0.1.0", path = "crates/piqueld-core"   }
piqueld-docker    = { version = "0.1.0", path = "crates/piqueld-docker" }
piqueld-generated = { path = "crates/piqueld-generated" }
piqueld-probe     = { version = "0.1.0", path = "crates/piqueld-probe"  }
piqueld-store     = { version = "0.1.0", path = "crates/piqueld-store"  }

# External
anstream = "1.0.0"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
unicode-width = "0.2.2"
anyhow = "1.0.98"
async-trait = "0.1.88"
axum = { version = "0.8.4", default-features = false, features = ["json", "query", "tokio", "http1", "tracing", "matched-path"] }
base64 = "0.22.1"
getrandom = "0.3.4"
# DNS-01: authoritative TXT propagation checks without a TLS stack.
hex = "0.4.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
# ACME on ring, matching reqwest's rustls provider; rcgen generates keys and CSRs.
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
openssl = "0.10.81"
parking_lot = "0.12.5"
# Telemetry export over OTLP/gRPC, through opentelemetry-proto's clients.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
# Exact, so passkey verification changes only through a reviewed bump.
webauthn-rs-core = "=0.5.5"
bytes = "1.10.1"
bollard = "0.19.1"
clap = { version = "4.5.40", features = ["derive"] }
clap_complete = "4.6.11"
futures-channel = "0.3.31"
futures-util = "0.3.31"
# Path globs as picomatch reads them, for `just check-changed`.
globset = { version = "0.4.18", default-features = false }
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.14", features = ["tokio"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_path_to_error = "0.1.17"
sha2 = "0.10.9"
sourceorigin-standard = "0.1.3"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "runtime-tokio", "sqlite"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.15", features = ["io", "io-util"] }
# WebSocket framing over connections upgraded by reqwest; axum `ws` uses the same version.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
toml = "1.1.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["request-id", "timeout", "trace"] }
utoipa = { version = "5.3.1", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2.0"
url = "2.5.4"
x509-parser = "0.16.0"
# YAML with anchors resolved, for `just check-changed`.
yaml-rust2 = { version = "0.13.2", default-features = false }
uuid = { version = "1.17.0", features = ["v7"] }

# Browser UI and same-origin WASM transport. These are target-gated in the
# client/UI crates so native daemon and CLI builds do not link browser code.
gloo-timers = "0.3.0"
leptos = { version = "0.8.21", default-features = false }
leptos_router = { version = "0.8.16", default-features = false }
# Exact pins, bumped together: they move in lockstep.
js-sys               = "=0.3.103"
wasm-bindgen          = "=0.2.126"
# Binds the dashboard in the build script: matches `wasm-bindgen` exactly.
wasm-bindgen-cli-support = "=0.2.126"
wasm-bindgen-futures  = "=0.4.76"
wasm-bindgen-test     = "=0.3.76"
web-sys               = "=0.3.103"

# Dashboard exec terminal: VT parsing and screen state, and shell-style command splitting.
shlex = "2.0.1"
vt100 = "0.16.2"

heck = "0.5.0"
proptest = "1.6.0"
prettyplease = "0.2.37"
progenitor = { version = "0.11.0", default-features = false }
progenitor-client = "0.11.0"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "stream"] }
syn = { version = "2.0.106", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Tests may expect, panic and dbg (see clippy.toml), but never unwrap.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
unreachable = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
# Library crates return text or log; binaries, examples and tests print.
print_stdout = "warn"
print_stderr = "warn"
# Every exception names its lint with `#[expect]` and says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "warn"
# Modules with children live in `foo/mod.rs`, not `foo.rs` next to `foo/`.
self_named_module_files = "warn"

# Line tables keep backtraces readable without most of a debug build's size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "symbols"

# The embedded dashboard's wasm32 build. Size beats speed: no `wasm-opt` needed.
# The build script strips host `CARGO_PROFILE_*` overrides.
[profile.dashboard]
inherits = "release"
opt-level = "z"
codegen-units = 1

# The static health probe's `probe` profile is in `crates/piqueld-docker/build/probe.toml`.
