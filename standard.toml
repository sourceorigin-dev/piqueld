[deviations.recipes]
reason = "rule challenge: `just validate` checks without modifying files, as AGENTS.md and docs/dev/validation.md say, so it runs `fmt-check` instead of `fmt`"
paths = ["justfile"]

[deviations.ci-shape]
reason = "rule challenge: `report` runs after `ci`, on the nightly run's result, and `fail-fast` watches for `ci` to start, so `ci` can't need either"
paths = [".github/workflows/ci.yml"]

[deviations.cache-saves]
reason = "rule challenge: pull requests save the small prebuilt dashboard on purpose, so the next one finds it before dashboard-cache.yml runs on main (see ci.yml)"
paths = [".github/actions/dashboard/action.yml"]

[deviations.nextest-config]
reason = "rule challenge: `just docker-test` bounds the Docker integration tests' run as a whole, so their override sets no `terminate-after`"
paths = [".config/nextest.toml"]

[deviations.workspace-dependencies]
reason = "rule challenge: `piqueld-generated` isn't published, so the crates that use it as a development dependency publish without it; and the daemon's tests depend on its own crate with the `fake-docker` feature"
paths = ["Cargo.toml", "apps/piqueld/Cargo.toml"]

# The pull request checks' settings, which they read at a pull request's base.
[pr-checks]
# The title scopes recent history uses; a title may also take none.
scopes = [
  "accounts", "agents", "api", "auth", "build", "builds", "ci", "cli",
  "client", "config", "core", "daemon", "deploy", "deps", "dev", "dns",
  "docker", "docs", "git", "ingress", "just", "lints", "logs", "manifest",
  "nix", "notifications", "observability", "packaging", "piquelctl",
  "playwright", "previews", "probe", "reconcile", "secrets", "server", "site",
  "standard", "store", "tailnet", "tests", "ui", "user", "web", "xtask",
]
issue-prefix = "PQD-"
approvers = ["PiquelChips"]
