# How piqueld applies the engineering standard, sourceorigin-standard: its
# settings, and the rules piqueld departs from, each with its reason. The
# crate's README lists the rules; `just standard` checks them.

# The lines of workflows' `run:` that run Cargo rather than a recipe: the
# prebuilt dashboard, the minimum supported Rust, the Docker tests' prebuild,
# and the release jobs, which install no `just`.
cargo-in-ci = [
  "cargo build --locked --package piqueld-ui --profile dashboard --target wasm32-unknown-unknown --target-dir target-ui",
  "cargo check --locked --package piqueld --package piquelctl --package piqueld-client",
  "cargo build --locked --package xtask",
  "cargo nextest run --locked -p piqueld ${{ matrix.binary }} --no-run",
  "cargo xtask publish --dry-run",
  "cargo xtask dist",
]

[deviations]
rust-comments = "1934 findings in 390 files, fixed in a follow-up"

[deviations.workspace-lints]
reason = "4675 findings of `clippy::unwrap_used` in 207 files, most of them tests, fixed in a follow-up (PQD-124)"
paths = ["Cargo.toml"]

[deviations.anyhow-edges]
reason = "3 findings: these libraries return anyhow errors; typed errors in a follow-up"
crates = ["piqueld", "piqueld-config", "piqueld-docker"]

[deviations.generated-lints]
reason = "160 findings: progenitor writes the `allow`s into the generated client; fixed in a follow-up"
paths = ["crates/piqueld-client/src/generated.rs"]

